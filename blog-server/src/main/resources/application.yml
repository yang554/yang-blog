spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://180.76.189.135:3306/yang-blog?serverTimezone=GMT%2b8
#    username: yang_repl
#    password: 123456
    url: jdbc:mysql://localhost:3306/yang-blog?serverTimezone=GMT%2b8
    username: root
    password: 123456
#    url: "@db.url@"
#    username: "@db.username@" #root
#    password: "@db.password@"  # 123456
  jap:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
#    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10000  # 10秒超时
    requested-heartbeat: 120   # 心跳间隔
    template:
          retry:
            enabled: true
            max-attempts: 5
            initial-interval: 2000ms
    cache:
          channel:
            size: 25
            checkout-timeout: 10000
          connection:
            mode: CONNECTION
            size: 5
    virtual-host: /
    listener:
          simple:
            retry:
              enabled: true
              max-attempts: 3
            acknowledge-mode: manual  # auto 手动确认模式manual
            prefetch: 10
            concurrency: 5
            max-concurrency: 10
  cache:
    type: redis
    redis:
      time-to-live: 1h
      port: 6379
      host: localhost
#      host: redis
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
      timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
 address : 0.0.0.0
 port: 8090
 servlet:
  session:
   timeout: 1440m  # 会话3天无活动失效

jwt:
  secret: secret-key
  expiration:
    access: 1800000        # 访问Token过期时间: 30分钟
    refresh: 2592000000    # 刷新Token过期时间: 30天
    remember-me: 7776000000 # 记住我Token过期时间: 90天
  token-header: Authorization
  token-prefix: "Bearer "

app:
  base-url: http://192.168.1.100:8090  # 替换为实际服务器IP
  upload:
    dir: /home/yanghj/app/app     # 上传目录配置
  download:
    base-url: http://180.76.189.135  # 下载基础URL配置

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.yang.blog.entity

# 设置根日志级别
logging:
  level:
#    root: DEBUG
#    org.springframework.web: DEBUG
#    com.mycompany.myapp: TRACE
    org.apache.shiro: DEBUG

# 指定日志文件的名称和位置
